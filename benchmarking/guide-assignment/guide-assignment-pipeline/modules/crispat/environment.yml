name: crispat
channels:
  - conda-forge
  - pytorch
  - bioconda
dependencies:
  - python=3.12
  # PINNED: this benchmark measures runtime, and the torch version is the single
  # biggest performance lever. 2.12 is what the last-built env resolved to
  # (cpu_mkl_py312 build), so this fixes a known-working combination rather than
  # letting each rebuild pick a different one.
  - pytorch=2.12
  - cpuonly       # This is the magic "make it easy" button for non-GPU users
  - pandas
  - scanpy
  - pip
  - pip:
    # PINNED to an immutable commit. '@benchmark' is a BRANCH -- it can move
    # under you and silently change the method between runs. This SHA is the
    # branch tip as of 2026-04-11 ("replace max(selected_guide.toarray()) with
    # selected_guide.max()").
    - git+https://github.com/jdeu1023/crispat.git@f870d65c71b9fa66013adbf3c0e85ca920aabf6d
