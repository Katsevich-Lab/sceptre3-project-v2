name: crispat
channels:
  - conda-forge
  - pytorch
  - bioconda
dependencies:
  - python=3.12
  # PINNED: this benchmark measures runtime, and the torch version is the single
  # biggest performance lever. 2.12 is what the last-built env resolved to
  # (cpu_mkl_py312 build), so this fixes a known-working combination rather than
  # letting each rebuild pick a different one.
  - pytorch=2.12
  - cpuonly       # This is the magic "make it easy" button for non-GPU users
  - pandas
  - scanpy
  - pip
  - pip:
    # UPSTREAM crispat, PINNED to an immutable commit: a9372b9 is the 0.9.11
    # version bump (2026-05-29), the tip of velten-group/crispat main.
    # Until 2026-09 this installed the fork jdeu1023/crispat@f870d65, whose only
    # change ("replace max(selected_guide.toarray()) with selected_guide.max()")
    # upstream has since made itself in a7ea84e (numpy >= 2 fix), so the fork
    # is no longer needed.
    - git+https://github.com/velten-group/crispat.git@a9372b9cf9b82b7409cc3be4d192056ae57a2673
