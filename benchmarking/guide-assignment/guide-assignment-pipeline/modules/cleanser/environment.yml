name: cleanser
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmdstan
  # Pinned: CLEANSER's Stan models are compiled by cmdstanpy, and 1.2 is the
  # series this env was built and validated against.
  - cmdstanpy=1.2
  - pandas
  - pip
  - pip:
    - git+https://github.com/Gersbachlab-Bioinformatics/CLEANSER.git@1.2.1
